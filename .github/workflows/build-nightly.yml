name: Build GlanceThing Nightly

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: blacksmith-4vcpu-windows-2025

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the project
        run: bun run build:win:nightly

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glancething-nightly-windows-${{ github.ref_name }}
          path: ./dist/glancething-nightly-*-setup.exe

  build-macos:
    runs-on: blacksmith-6vcpu-macos-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the project
        run: bun run build:mac:nightly

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glancething-nightly-macos-${{ github.ref_name }}
          path: ./dist/glancething-nightly-*.dmg

  build-linux:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the project
        run: bun run build:linux:nightly

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glancething-nightly-linux-${{ github.ref_name }}
          path: ./dist/glancething-nightly-*.AppImage


  build-client:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the project
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glancething-nightly-client-${{ github.ref_name }}
          path: ./client/dist